<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122a2e" />
      <stop offset="100%" stop-color="#091719" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ec2ba" />
      <stop offset="100%" stop-color="#29a39f" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#aboutBg)" />

  <!-- Grid overlay -->
  <g stroke="rgba(78, 194, 186, 0.08)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>

  <!-- Motion Timeline Graphic -->
  <rect x="160" y="160" width="480" height="280" rx="16" fill="#18373c" stroke="url(#cyanLine)" stroke-width="2" />
  
  <!-- Video Track Headers -->
  <rect x="180" y="200" width="120" height="32" rx="6" fill="#1f7a7c" />
  <rect x="310" y="200" width="310" height="32" rx="6" fill="rgba(78, 194, 186, 0.2)" />
  <rect x="180" y="245" width="180" height="32" rx="6" fill="rgba(41, 163, 159, 0.4)" />
  <rect x="370" y="245" width="250" height="32" rx="6" fill="#29a39f" />
  <rect x="180" y="290" width="240" height="32" rx="6" fill="rgba(78, 194, 186, 0.3)" />
  <rect x="430" y="290" width="190" height="32" rx="6" fill="#1f7a7c" />

  <!-- Playhead line -->
  <line x1="400" y1="170" x2="400" y2="430" stroke="#ffc453" stroke-width="3" />
  <polygon points="390,170 410,170 400,185" fill="#ffc453" />

  <text x="400" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#e6f6f5" text-anchor="middle">
    CREATIVE STUDIO &amp; MOTION TIMELINE
  </text>
  <text x="400" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400" fill="#a3c7c7" text-anchor="middle">
    assets/images/about-placeholder.jpg
  </text>
</svg>
